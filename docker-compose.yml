version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: dictionaryapi-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: DictionaryAppDb
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - dictionary-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - BUILDKIT_INLINE_CACHE=1
    image: dictionaryapi:latest
    container_name: dictionaryapi-web
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      DOTNET_RUNNING_IN_CONTAINER: "true"
      ConnectionStrings__DictionaryAppDb: "Server=mysql;Port=3306;Database=DictionaryAppDb;User=root;Password=root;"
      Jwt__SecurityKey: "YourSuperSecretKeyForJWTTokenGeneration123!@#"
      Jwt__Issuer: "DictionaryApi"
      Jwt__Audience: "DictionaryApiUsers"
      Jwt__ExpirationInMinutes: "60"
      Settings__MaxFailedLoginAttempts: "5"
      Settings__LockoutDurationInMinutes: "30"
    ports:
      - "5000:8080"
    depends_on:
      mysql: 
        condition: service_healthy
    networks:
      - dictionary-network
    restart: on-failure

  libretranslate:
    image: libretranslate/libretranslate:latest
    container_name: libretranslate
    ports:
      - "80:80"
    networks:
      - dictionary-network
    restart: unless-stopped

  web-app:
    build:
      context: ./sources/Web.App/web-app
      dockerfile: Dockerfile
    container_name: web-app
    ports:
      - "3000:3000"
    networks:
      - dictionary-network
    restart: unless-stopped

volumes:
  mysql_data:
    driver: local

networks:
  dictionary-network:
    driver: bridge